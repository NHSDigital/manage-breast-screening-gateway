services:
  # Gateway service that handles Relay communication,
  # Modality worklist queries, DICOM communication with the PACS server, and uploads to the cloud API.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway
    command: /bin/bash -c "./scripts/bash/entrypoint.sh"
    ports:
      - "4243:4243"
      - "4244:4244"
    volumes:
      - pacs-storage:/var/lib/pacs/storage
      - pacs-db:/var/lib/pacs
    environment:
      - AZURE_RELAY_NAMESPACE=${AZURE_RELAY_NAMESPACE}
      - AZURE_RELAY_HYBRID_CONNECTION=${AZURE_RELAY_HYBRID_CONNECTION}
      - AZURE_RELAY_KEY_NAME=${AZURE_RELAY_KEY_NAME}
      - AZURE_RELAY_SHARED_ACCESS_KEY=${AZURE_RELAY_SHARED_ACCESS_KEY}
      - CLOUD_API_ENDPOINT=${CLOUD_API_ENDPOINT:-http://host.docker.internal:8000/api/v1/dicom}
      - CLOUD_API_TOKEN=${CLOUD_API_TOKEN:-testtoken}
      - LOG_LEVEL=INFO
      - MWL_AET=MWL_SCP
      - MWL_PORT=${MWL_PORT:-4243}
      - MWL_DB_PATH=${MWL_DB_PATH:-/var/lib/pacs/worklist.db}
      - PACS_AET=SCREENING_PACS
      - PACS_PORT=${PACS_PORT:-4244}
      - PACS_STORAGE_PATH=${PACS_STORAGE_PATH:-/var/lib/pacs/storage}
      - PACS_DB_PATH=${PACS_DB_PATH:-/var/lib/pacs/pacs.db}
      - UPLOAD_POLL_INTERVAL=2
      - UPLOAD_BATCH_SIZE=10
      - MAX_UPLOAD_RETRIES=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sqlite3", "/var/lib/pacs/pacs.db", "SELECT 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Linux networking requires the host-gateway to be set up in Docker. This is not required for Windows or MacOS.
    # CLOUD_API_ENDPOINT is set to http://host.docker.internal:8000/api/v1/dicom by default.
    # This allows the gateway to communicate with the cloud API running on the host machine.
    # Ensure that Rubie's ALLOWED_HOSTS env contain host.docker.internal for the gateway to function correctly.
    # On Linux ensure that Rubie is running on the host machine at http://0.0.0.0:8000/api/v1/dicom.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Alternatively, you can use host networking mode on Linux, but this is not supported on Windows or MacOS.
    # network_mode: host

  # Modality Emulator service for testing purposes. This service emulates a DICOM modality that sends images to the gateway.
  # To use the modality emulator, you need to enable the "modality_emulator" profile when running docker-compose.
  # eg: docker compose --profile modality_emulator up
  modality_emulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modality-emulator
    command: ["uv", "run", "python", "-m", "src.modality_emulator"]
    volumes:
      - pacs-storage:/var/lib/pacs/storage
      - pacs-db:/var/lib/pacs
    environment:
      - PACS_DB_PATH=/var/lib/pacs/pacs.db
      - PACS_STORAGE_PATH=/var/lib/pacs/storage
      - MWL_DB_PATH=/var/lib/pacs/worklist.db
      - LOG_LEVEL=INFO
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - "modality_emulator"
    network_mode: host

volumes:
  pacs-storage:
    driver: local
  pacs-db:
    driver: local
